<style>
:root{--bg:#f7f0c4;--card:#fffbea;--ink:#35143f;--muted:#806b7e;--line:#e6dba9;--purple:#3c164a;--purple-soft:#eee1ef;--mint:#e8efc9;--green:#5a7137;--orange:#fff1c4;--red:#a84551;--shadow:0 8px 28px #49331510}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}.lock input{height:54px;width:210px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;font-size:1.5rem;letter-spacing:.25em}.lock .err{color:var(--red);min-height:1.4em}.lock-logo{width:min(82vw,340px);height:auto;border-radius:18px;background:#fff;padding:8px;box-shadow:0 8px 32px #49331520;margin-bottom:7px}.lock .logo{margin-bottom:3px}.lock h1{margin:0}.lock .btn{min-width:210px}textarea{width:100%;min-height:68px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;font:12px/1.45 ui-monospace,monospace}header{max-width:960px;margin:auto;padding:24px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:13px;object-fit:cover;border:1px solid var(--line);background:var(--card)}.brand-mark{width:145px;height:auto;display:block;border-radius:12px;background:#fff;padding:4px}.brand p{color:var(--muted);margin:2px 0 0;font-size:.86rem}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;background:var(--purple);color:#fff;border-radius:12px;padding:11px 15px;font-weight:650}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:8px 11px;font-size:.88rem;min-height:40px}.wrap{max-width:960px;margin:auto;padding:8px 20px 44px}.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:0;border-radius:999px;background:transparent;color:var(--muted);padding:9px 15px;white-space:nowrap;font-weight:600}.nav-icon{margin-right:5px}.nav button.active{background:var(--purple);color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 16px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:.85rem}.stat strong{display:block;font-size:1.45rem;margin-top:5px}.panel{padding:18px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.panel h2{font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-size:1.05rem;margin:0;letter-spacing:.01em}.hint{color:var(--muted);font-size:.9rem;margin:4px 0 0}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{color:var(--muted);font-size:.82rem;font-weight:600}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #7656d622}.span2{grid-column:span 2}.span4{grid-column:span 4}.form-actions{display:flex;gap:8px;align-items:center;margin-top:12px}.walk{border-top:1px solid var(--line);padding:13px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.walk:first-child{border-top:0}.walk-title{font-weight:700}.walk-meta{color:var(--muted);font-size:.88rem;margin-top:3px}.walk-clock{color:var(--purple);font-size:.98rem;font-weight:800}.walk-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:.77rem;font-weight:700;background:var(--purple-soft);color:#6144bf}.badge.done{background:var(--mint);color:var(--green)}.badge.pending{background:var(--orange);color:#865d20}.badge.cancel{background:#fbe7e9;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:28px 12px}.client{border-top:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;gap:12px}.client:first-child{border-top:0}.client strong{display:block}.client small{display:block;color:var(--muted);margin-top:3px}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters input,.filters select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}.money{font-variant-numeric:tabular-nums}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 15px;border-radius:12px;background:#28243b;color:white;box-shadow:var(--shadow);z-index:5}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:.82rem;padding:8px 0 0}.danger{color:var(--red)}@media(max-width:680px){header{padding:calc(17px + env(safe-area-inset-top)) 15px 8px;align-items:flex-start;flex-wrap:wrap}.head-actions{width:100%;justify-content:flex-start}.head-actions #calendarExport{display:inline-flex}.wrap{padding:6px 15px calc(96px + env(safe-area-inset-bottom))}.head-actions #export,.head-actions #importBtn{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat strong{font-size:1.25rem}.form-grid{grid-template-columns:repeat(2,1fr)}.span4{grid-column:span 2}.span2{grid-column:span 2}.panel{padding:15px}.field input,.field select,.field textarea{min-height:44px}.btn.small{min-height:42px}.walk{grid-template-columns:1fr}.walk-actions{justify-content:flex-start}.brand-mark{width:135px}.brand p{font-size:.8rem}.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;gap:3px;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px #49331512}.nav button{display:flex;flex:1;min-width:0;min-height:54px;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px;font-size:.7rem}.nav-icon{margin-right:0;font-size:1.2rem;line-height:1.2}}
@media(max-width:420px){body{font-size:14px}.brand-mark{width:125px}.head-actions{display:grid;grid-template-columns:1fr 1fr}.head-actions .btn{min-height:44px;padding:9px 8px}.wrap{padding-left:12px;padding-right:12px}.nav{gap:5px}.nav button{padding:5px 1px;font-size:.68rem}.panel{border-radius:15px;padding:13px}.stats{gap:8px}.stat{padding:11px}.stat strong{font-size:1.12rem}.field input,.field select,.field textarea,.filters input,.filters select{font-size:16px}.form-actions{flex-wrap:wrap}.form-actions .btn{min-height:44px}}
</style>
</head>
<body>
<div id="lock"></div><div id="app-shell"><header><div class="brand"><div><img class="brand-mark" src="logo-titulo.png" alt="Logo Patitas en Ruta"><p>Agenda, clientes y pagos en un solo lugar</p></div></div><div class="head-actions"><button class="btn secondary small" id="calendarExport">📅 Exportar agenda</button><button class="btn secondary small" id="export">⬇️ Respaldo</button><button class="btn secondary small" id="importBtn">⬆️ Importar</button><input id="importFile" class="hidden" type="file" accept="application/json"></div></header>
<main class="wrap"><nav class="nav" id="nav"><button data-view="home" class="active"><span class="nav-icon">🏡</span><span>Resumen</span></button><button data-view="agenda"><span class="nav-icon">📅</span><span>Agenda</span></button><button data-view="clients"><span class="nav-icon">🐕</span><span>Clientes</span></button><button data-view="reports"><span class="nav-icon">💵</span><span>Cobros</span></button><button data-view="security"><span class="nav-icon">🔐</span><span>Seguridad</span></button></nav><div id="content"></div><footer>Tus datos quedan guardados en este equipo. Usa Respaldo para moverlos a otro.</footer></main><div id="toast" class="toast hidden" role="status"></div></div>
<script>
const KEY="paseos-perrunos-v1",PIN_KEY="patitas-access-pin-v1",BIO_KEY="patitas-access-bio-v1";let db={clients:[],walks:[]},view="home",filterDate=localDate(),reportMonth=localDate().slice(0,7),editWalk=null,editClient=null,toastTimer,securityOpen=false;
try{localStorage.removeItem("patitas-sync-v1");localStorage.removeItem("patitas-sync-base-v1")}catch{}
function localDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function normalizedDb(obj){obj=obj&&typeof obj==="object"?obj:{};obj.clients=Array.isArray(obj.clients)?obj.clients:[];obj.walks=Array.isArray(obj.walks)?obj.walks:[];obj.walkers=Array.isArray(obj.walkers)?obj.walkers:[];obj.monthlyPaid=obj.monthlyPaid||{};let old=Number.isFinite(Number(obj.commissionPerWalk))?Math.max(0,+obj.commissionPerWalk):0;obj.commissionByService={Paseo:1000,Trekking:0,Hotel:2000,"Pet sitter":2000,...(obj.commissionByService||{})};if(!obj.commissionPaseoConfigured)obj.commissionByService.Paseo=1000;if(!obj.commissionHotelConfigured)obj.commissionByService.Hotel=2000;if(!obj.commissionPetSitterConfigured)obj.commissionByService["Pet sitter"]=2000;obj.walks.forEach(w=>{w.service=w.service||"Paseo";w.nights=Math.max(1,+w.nights||1)});return obj}
try{db=normalizedDb(JSON.parse(localStorage.getItem(KEY)||"null")||db)}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Number(n)||0)}
function dateLabel(s){if(!s)return "";return new Date(s+"T12:00:00").toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"short"})}
function walkTimeRange(w){let duration=Math.max(1,Number(w.minutes)||60),match=/^(\d{2}):(\d{2})$/.exec(w.time||"");if(!match)return `Hora sin definir · ${duration} min`;let start=Number(match[1])*60+Number(match[2]),end=start+duration,day=Math.floor(end/1440),clock=n=>`${String(Math.floor((n%1440)/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;return `${clock(start)}–${clock(end)}${day?" (+1 día)":""} · ${duration} min`}
function monthKey(s){return (s||"").slice(0,7)}
function client(id){return db.clients.find(c=>c.id===id)}
function billingFor(month){let groups={},paid=0,due=0,count=0,commissionTotal=0,total=0;db.clients.filter(c=>(+c.monthlyFee||0)>0).forEach(c=>{let isPaid=!!db.monthlyPaid[month+"|"+c.id];groups[c.id]={id:c.id,owner:c.owner,service:"Mensualidad",count:0,units:0,total:+c.monthlyFee,paid:isPaid?+c.monthlyFee:0,due:isPaid?0:+c.monthlyFee,monthly:true,commission:0}});db.walks.filter(w=>monthKey(w.date)===month&&w.status==="Realizado").forEach(w=>{count++;let c=client(w.clientId),service=w.service||"Paseo",monthly=service==="Paseo"&&c&&(+c.monthlyFee||0)>0;if(monthly){groups[c.id].count++;groups[c.id].commission+=(+db.commissionByService.Paseo||0);return}let key=(w.clientId||"sin-cliente")+"|"+service;if(!groups[key])groups[key]={id:key,owner:(c||{}).owner||"Cliente",service,count:0,units:0,total:0,paid:0,due:0,monthly:false,commission:0};let g=groups[key],units=service==="Hotel"?Math.max(1,+w.nights||1):1,price=(+w.price||0)*units,commission=(+db.commissionByService[service]||0)*units;g.count++;g.units+=units;g.total+=price;g.commission+=commission;if(w.paid)g.paid+=price;else g.due+=price});Object.values(groups).forEach(g=>{g.net=g.total-g.commission;total+=g.total;commissionTotal+=g.commission;paid+=g.paid;due+=g.due});return {groups:Object.values(groups),paid,due,count,total,commission:commissionTotal,net:total-commissionTotal}}

function toast(s){let el=document.getElementById("toast");el.textContent=s;el.classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("hidden"),2400)}
function stat(label,value,emoji){return `<div class="stat"><span>${emoji} ${label}</span><strong>${value}</strong></div>`}
function clientLabel(w){let c=client(w.clientId);return c?c.owner:"Cliente eliminado"}
function statusBadge(s){return s==="Realizado"?'<span class="badge done">✅ Realizado</span>':s==="Cancelado"?'<span class="badge cancel">Cancelado</span>':'<span class="badge">Agendado</span>'}
function walkCard(w){let c=client(w.clientId)||{},service=w.service||"Paseo",monthly=service==="Paseo"&&(+c.monthlyFee||0)>0,units=service==="Hotel"?Math.max(1,+w.nights||1):1,charge=(+w.price||0)*units,commission=(+db.commissionByService[service]||0)*units,label=service==="Hotel"?`${money(w.price)} por noche · ${units} ${units===1?"noche":"noches"} · total ${money(charge)}`:monthly?"Incluido en mensualidad":`${money(w.price)} · ${service.toLowerCase()}`;return `<article class="walk"><div><div class="walk-title">${service==="Hotel"?"🏨":service==="Trekking"?"🥾":service==="Pet sitter"?"🏠":"🐶"} ${esc(w.dog)} <span class="hint">· ${esc(service)} con ${esc(c.owner||"Cliente")}</span></div><div class="walk-meta">${dateLabel(w.date)} · <strong class="walk-clock">🕒 ${service==="Hotel"?`${esc(w.time||"09:00")} · ${units} ${units===1?"noche":"noches"}`:esc(walkTimeRange(w))}</strong> · ${label}</div><div class="walk-meta">${commission>0?`➖ Comisión de ${esc(w.dog)}: ${money(commission)}${service==="Hotel"?` (${money(db.commissionByService[service])} por noche)`:""}`:`✅ Sin comisión para este servicio`}</div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px">${statusBadge(w.status)}${w.status==="Realizado"&&!monthly?(w.paid?'<span class="badge done">💚 Pagado</span>':'<span class="badge pending">🟠 Por cobrar</span>'):""}</div>${w.note?`<div class="walk-meta">📝 ${esc(w.note)}</div>`:""}</div><div class="walk-actions">${w.status!=="Cancelado"?`<button class="btn secondary small" data-act="calendar" data-id="${w.id}">📅 Añadir al calendario</button>`:""}${w.status==="Agendado"?`<button class="btn small" data-act="done" data-id="${w.id}">Marcar realizado</button>`:""}${w.status==="Realizado"&&!monthly?`<button class="btn secondary small" data-act="paid" data-id="${w.id}">${w.paid?"Desmarcar pago":"Marcar pagado"}</button>`:""}<button class="btn secondary small" data-act="edit" data-id="${w.id}">Editar</button><button class="btn secondary small danger" data-act="delete" data-id="${w.id}">Borrar</button></div></article>`}
function walkForm(){let w=editWalk?db.walks.find(x=>x.id===editWalk):null,service=w?.service||"Paseo";return `<section class="panel" id="walkForm"><div class="panel-head"><div><h2>${w?"✏️ Editar servicio":"✨ Agendar un servicio"}</h2><p class="hint">Elige el servicio, anota quién, cuándo y su precio.</p></div></div>${db.clients.length?`<div class="form-grid"><div class="field span2"><label>Cliente</label><select id="wClient">${db.clients.map(c=>`<option value="${c.id}" ${w?.clientId===c.id?"selected":""}>${esc(c.owner)} · ${esc(c.dogs.join(", "))}</option>`).join("")}</select></div><div class="field span2"><label>Perro</label><select id="wDog"></select></div><div class="field"><label>Servicio</label><select id="wService">${["Paseo","Trekking","Hotel","Pet sitter"].map(x=>`<option ${service===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Fecha de inicio</label><input id="wDate" type="date" value="${w?.date||localDate()}"></div><div class="field"><label>Hora</label><input id="wTime" type="time" value="${w?.time||"09:00"}"></div><div class="field" id="wMinutesField"><label>Duración (min)</label><input id="wMinutes" type="number" min="1" inputmode="numeric" value="${w?.minutes||60}"></div><div class="field hidden" id="wNightsField"><label>Noches de alojamiento</label><input id="wNights" type="number" min="1" inputmode="numeric" value="${w?.nights||1}"></div><div class="field"><label id="wPriceLabel">Precio por paseo (CLP)</label><input id="wPrice" type="number" min="0" inputmode="numeric" placeholder="Ej: 8000" value="${w?.price??""}"></div><div class="field"><label>Estado</label><select id="wStatus"><option ${!w||w.status==="Agendado"?"selected":""}>Agendado</option><option ${w?.status==="Realizado"?"selected":""}>Realizado</option><option ${w?.status==="Cancelado"?"selected":""}>Cancelado</option></select></div><div class="field"><label>Pago</label><select id="wPaid"><option value="no" ${!w?.paid?"selected":""}>Pendiente</option><option value="yes" ${w?.paid?"selected":""}>Pagado</option></select></div><div class="field span2"><label>Nota interna (opcional)</label><input id="wNote" placeholder="Solo visible para las dueñas" value="${esc(w?.note||"")}"></div></div><div class="form-actions"><button class="btn" data-act="saveWalk">${w?"Guardar cambios":"Agregar a la agenda"}</button>${w?'<button class="btn secondary" data-act="cancelEdit">Cancelar</button>':""}</div>`:`<div class="empty">Primero agrega un cliente y su perro en la pestaña Clientes.</div>`}</section>`}
function home(){let today=db.walks.filter(w=>w.date===localDate()&&w.status!=="Cancelado"),billing=billingFor(monthKey(localDate()));return `<div class="stats">${stat("Servicios hoy",today.length,"🐾")}${stat("Clientes",db.clients.length,"🐕")}${stat("Cobrado este mes",money(billing.paid),"💚")}${stat("Por cobrar",money(billing.due),"🧾")}</div>${walkForm()}<section class="panel"><div class="panel-head"><div><h2>📍 Próximos servicios</h2><p class="hint">Tu agenda de hoy y los siguientes días.</p></div><button class="btn secondary small" data-act="goAgenda">Ver agenda</button></div>${db.walks.filter(w=>w.date>=localDate()&&w.status!=="Cancelado").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5).map(walkCard).join("")||'<div class="empty">Aún no hay servicios agendados. ¡Agrega el primero!</div>'}</section>`}
function agenda(){let list=db.walks.filter(w=>w.date===filterDate).sort((a,b)=>a.time.localeCompare(b.time));return `<section class="panel"><div class="panel-head"><div><h2>📅 Agenda</h2><p class="hint">Consulta y actualiza los servicios de un día.</p></div><div class="filters"><input id="filterDate" type="date" value="${filterDate}"><button class="btn small" data-act="today">Hoy</button></div></div>${list.map(walkCard).join("")||'<div class="empty">No hay servicios para este día.</div>'}</section>`}
function clients(){let c=editClient?client(editClient):null;return `<section class="panel"><div class="panel-head"><div><h2>🐕 ${c?"Editar cliente":"Clientes y perros"}</h2><p class="hint">Guarda los datos y el tipo de cobro de cada cliente.</p></div></div><div class="form-grid"><div class="field span2"><label>Nombre de la persona</label><input id="cOwner" placeholder="Ej: Camila Pérez" value="${esc(c?.owner||"")}"></div><div class="field"><label>Teléfono</label><input id="cPhone" type="tel" placeholder="+56 9 ..." value="${esc(c?.phone||"")}"></div><div class="field"><label>Comuna o sector</label><input id="cArea" placeholder="Ej: Ñuñoa" value="${esc(c?.area||"")}"></div><div class="field span2"><label>Dirección</label><input id="cAddress" autocomplete="street-address" placeholder="Calle y número" value="${esc(c?.address||"")}"></div><div class="field span2"><label>Nombre(s) de perro(s)</label><input id="cDogs" placeholder="Ej: Luna, Max" value="${esc(c?.dogs?.join(", ")||"")}"></div><div class="field span2"><label>Cobro mensual acordado (CLP)</label><input id="cMonthly" type="number" min="0" inputmode="numeric" placeholder="Déjalo en 0 si cobras por paseo" value="${c?.monthlyFee||""}"></div><div class="field span2"><label>Indicaciones (opcional)</label><input id="cNote" placeholder="Rutina, cuidados, contacto de emergencia" value="${esc(c?.note||"")}"></div></div><div class="form-actions"><button class="btn" data-act="${c?"saveClient":"addClient"}">${c?"Guardar cambios":"Guardar cliente"}</button>${c?'<button class="btn secondary" data-act="cancelClient">Cancelar</button>':""}</div></section><section class="panel"><div class="panel-head"><h2>📒 Lista de clientes</h2><span class="badge">${db.clients.length}</span></div>${db.clients.map(c=>`<div class="client"><div><strong>${esc(c.owner)} ${c.area?`<span class="hint">· ${esc(c.area)}</span>`:""}</strong><small>${c.address?`📍 ${esc(c.address)} · `:""}🐶 ${esc(c.dogs.join(", "))} · ${esc(c.phone||"Sin teléfono")}${(+c.monthlyFee||0)>0?` · Mensualidad ${money(c.monthlyFee)}`:" · Cobra por paseo"}${c.note?`<br>📝 ${esc(c.note)}`:""}</small></div><div class="walk-actions"><button class="btn secondary small" data-act="editClient" data-id="${c.id}">Editar</button><button class="btn secondary small danger" data-act="deleteClient" data-id="${c.id}">Borrar</button></div></div>`).join("")||'<div class="empty">Agrega a tu primer cliente.</div>'}</section>`}
function reports(){let month=reportMonth,list=db.walks.filter(w=>monthKey(w.date)===month&&w.status==="Realizado"),bill=billingFor(month),count=list.length,monthName=month?new Date(month+"-15T12:00:00").toLocaleDateString("es-CL",{month:"long",year:"numeric"}):"este mes",services=["Paseo","Trekking","Hotel","Pet sitter"];return `<section class="panel"><div class="panel-head"><div><h2>⚙️ Comisión por servicio</h2><p class="hint">Define el monto fijo que Patitas en Ruta descuenta por cada servicio. En hotel, se aplica por noche.</p></div></div><div class="form-grid">${services.map(s=>`<div class="field"><label>Comisión ${s==="Pet sitter"?"pet sitter":s.toLowerCase()} (CLP${s==="Hotel"?" por noche":" por servicio"})</label><input id="commission-${s.replace(" ","")}" type="number" min="0" step="100" inputmode="numeric" value="${+db.commissionByService[s]||0}" placeholder="0"></div>`).join("")}</div><div class="form-actions"><button class="btn" data-act="saveCommission">Guardar comisiones</button></div></section><div class="stats">${stat("Servicios realizados",count,"🐾")}${stat("Cobro bruto",money(bill.total),"💵")}${stat("Comisión",money(bill.commission),"➖")}${stat("Ingreso neto estimado",money(bill.net),"💚")}${stat("Cobrado",money(bill.paid),"✅")}${stat("Pendiente",money(bill.due),"🧾")}</div><section class="panel"><div class="panel-head"><div><h2>🧾 Cobro del mes por cliente y servicio</h2><p class="hint">La mensualidad cubre los paseos; los otros servicios se cobran aparte. Los cancelados no se incluyen.</p></div><input id="reportsMonth" type="month" value="${month}"></div><p class="hint">En hotel se multiplica el precio y la comisión por el número de noches.</p>${bill.groups.map(g=>{let avg=g.count?money(g.total/g.count):"—";return `<div class="client"><div><strong>🐕 ${esc(g.owner)} · ${esc(g.service)} · ${g.count} ${g.count===1?"servicio":"servicios"}</strong><small>${g.monthly?`Mensualidad: ${money(g.total)} · Promedio por paseo: ${avg}`:`Total bruto: ${money(g.total)} · Promedio por servicio: ${avg}`} · Comisión ${money(g.commission)} · Neto estimado ${money(g.net)} · Pagado ${money(g.paid)} · Pendiente ${money(g.due)}</small></div>${g.monthly?`<button class="btn ${g.due?"":"secondary"} small" data-act="monthlyPaid" data-id="${esc(g.id)}">${g.due?"Marcar mes pagado":"Desmarcar pago"}</button>`:`<span class="badge ${g.due?"pending":"done"}">${g.due?"Por cobrar":"Pagado"}</span>`}</div>`}).join("")||'<div class="empty">Todavía no hay servicios realizados para este mes.</div>'}</section><section class="panel"><div class="panel-head"><div><h2>💵 Detalle de servicios</h2><p class="hint">Servicios realizados durante ${monthName}.</p></div></div>${list.map(walkCard).join("")||'<div class="empty">Todavía no hay servicios realizados este mes.</div>'}</section>`}

function securityView(){let access=hasPin()?"Clave activada en este dispositivo.":"Sin bloqueo: puedes usar la app directamente.",h=`<section class="panel"><h2>🔐 Acceso a la app</h2><p class="hint">${access} La clave y la biometría son opcionales y se configuran en cada dispositivo.</p><button class="btn secondary" data-act="changePin">${hasPin()?"Cambiar clave":"Crear clave de acceso"}</button> `;if(hasPin())h+='<button class="btn secondary danger" data-act="removePin">Quitar clave</button> ';if(hasBio())h+='<button class="btn secondary" data-act="bioOff">Desactivar biometría</button>';else h+='<button class="btn secondary" data-act="bioOn"'+(!bioAvailable()||!hasPin()?' disabled':'')+'>Activar Face ID, huella o Windows Hello</button>';if(!hasPin())h+='<p class="hint">Para usar biometría, primero crea una clave de respaldo. Si falla Face ID o la huella, podrás entrar con esa clave.</p>';else if(!bioAvailable())h+='<p class="hint">La biometría requiere un enlace HTTPS y un navegador compatible.</p>';h+='</section><section class="panel"><h2>💾 Respaldo de datos</h2><p class="hint">La agenda y los clientes se guardan solo en este navegador. Para pasarlos a otro equipo, descarga un respaldo aquí y luego impórtalo en ese equipo.</p></section>';return h;}

function hasPin(){try{return !!localStorage.getItem(PIN_KEY)}catch{return false}}
function bioAvailable(){return !!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials?.create&&navigator.credentials?.get)}
function hasBio(){try{return !!localStorage.getItem(BIO_KEY)}catch{return false}}
function b64u(bytes){let s="";bytes.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}
function unb64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";let b=atob(s),out=new Uint8Array(b.length);for(let i=0;i<b.length;i++)out[i]=b.charCodeAt(i);return out}
async function pinDigest(pin,salt){let key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]),bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:unb64u(salt),iterations:120000,hash:"SHA-256"},key,256);return b64u(new Uint8Array(bits))}
function lockMarkup(inner){let lock=document.getElementById("lock");lock.className="lock";lock.innerHTML=inner}
function openApp(){document.getElementById("lock").className="";document.getElementById("lock").innerHTML="";render()}
function showPinSetup(){lockMarkup('<img class="lock-logo" src="logo-titulo.png" alt="Logo Patitas en Ruta"><p class="hint">Crea una clave de acceso de 6 números para proteger tus datos.</p><input id="newPin" type="password" inputmode="numeric" maxlength="6" placeholder="6 números"><input id="confirmPin" type="password" inputmode="numeric" maxlength="6" placeholder="Repite la clave"><p class="err" id="pinError"></p><button class="btn" id="saveNewPin">Guardar clave</button>');document.getElementById("saveNewPin").onclick=saveNewPin}
async function saveNewPin(){let a=document.getElementById("newPin").value,b=document.getElementById("confirmPin").value;if(!/^\d{6}$/.test(a)||a!==b){document.getElementById("pinError").textContent="Ingresa la misma clave de 6 números en ambos campos.";return}let salt=crypto.getRandomValues(new Uint8Array(16));localStorage.setItem(PIN_KEY,JSON.stringify({salt:b64u(salt),hash:await pinDigest(a,b64u(salt))}));openApp()}
function showBioSetup(){lockMarkup('<img class="lock-logo" src="logo-titulo.png" alt="Logo Patitas en Ruta"><p class="hint">¿Quieres activar Face ID, huella o Windows Hello en este equipo? La clave seguirá disponible.</p><button class="btn" id="enableBioNow">Activar biometría</button><button class="btn secondary" id="skipBio">Continuar con clave</button>');document.getElementById("enableBioNow").onclick=enableBio;document.getElementById("skipBio").onclick=openApp}
async function enableBio(){try{if(!bioAvailable()||!await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())throw Error("Este dispositivo o navegador no ofrece biometría compatible.");let challenge=crypto.getRandomValues(new Uint8Array(32)),uid=crypto.getRandomValues(new Uint8Array(16)),cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:"Patitas en Ruta",id:location.hostname},user:{id:uid,name:"usuario",displayName:"Patitas en Ruta"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000,attestation:"none"}});if(!cred)throw Error("No se completó la activación.");localStorage.setItem(BIO_KEY,JSON.stringify({id:b64u(new Uint8Array(cred.rawId))}));toast("Biometría activada en este dispositivo.");openApp()}catch(e){lockMarkup(`<img class="lock-logo" src="logo-titulo.png" alt="Logo Patitas en Ruta"><p class="hint">${esc(e.message||"No se pudo activar biometría.")} La clave seguirá funcionando.</p><button class="btn" id="continuePin">Continuar con clave</button>`);document.getElementById("continuePin").onclick=openApp}}
function showPinUnlock(message="Ingresa tu clave de 6 números") {lockMarkup(`<img class="lock-logo" src="logo-titulo.png" alt="Logo Patitas en Ruta"><p class="hint">${esc(message)}</p><input id="enterPin" type="password" inputmode="numeric" maxlength="6" placeholder="6 números"><p class="err" id="pinError"></p><button class="btn" id="verifyPin">Desbloquear</button>`);document.getElementById("verifyPin").onclick=verifyPin;document.getElementById("enterPin").onkeydown=e=>{if(e.key==="Enter")verifyPin()}}
async function verifyPin(){let input=document.getElementById("enterPin"),pin=input.value;try{let saved=JSON.parse(localStorage.getItem(PIN_KEY)||"null");if(saved&&await pinDigest(pin,saved.salt)===saved.hash){openApp();return}}catch{}document.getElementById("pinError").textContent="La clave no coincide.";input.value=""}
function lockScreen(){if(!hasPin()){showPinSetup();return}if(hasBio()){lockMarkup('<img class="lock-logo" src="logo-titulo.png" alt="Logo Patitas en Ruta"><p class="hint">Desbloquea con biometría o usa tu clave.</p><button class="btn" id="unlockBio">Continuar con Face ID, huella o Windows Hello</button><button class="btn secondary" id="usePin">Usar clave</button>');document.getElementById("unlockBio").onclick=unlockBio;document.getElementById("usePin").onclick=()=>showPinUnlock();return}showPinUnlock()}
async function unlockBio(){try{let cfg=JSON.parse(localStorage.getItem(BIO_KEY)||"null");await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:unb64u(cfg.id)}],userVerification:"required",timeout:60000}});openApp()}catch{showPinUnlock("No se completó la biometría. Ingresa tu clave.")}}
function accessControl(){if(hasPin())lockScreen();else openApp()}
function icsEscape(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}
function icsLocal(date,time,offset=0){let d=new Date(`${date}T${time||"09:00"}:00`);d.setMinutes(d.getMinutes()+offset);return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}00`}
function exportCalendar(list,name){list=list.filter(w=>w.date&&w.status!=="Cancelado");if(!list.length){toast("No hay servicios para exportar.");return}let stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""),events=list.map(w=>{let c=client(w.clientId)||{},service=w.service||"Paseo",hotel=service==="Hotel",minutes=hotel?Math.max(1,+w.nights||1)*1440:(w.minutes||60),details=[`Servicio: ${service}`,`Cliente: ${c.owner||""}`,`Perro: ${w.dog}`,hotel?`Alojamiento: ${w.nights||1} noche(s)`:`Duración: ${w.minutes||60} min`,hotel?`Precio por noche: ${money(w.price)} · Total: ${money((+w.price||0)*(+w.nights||1))}`:`Precio: ${money(w.price)}`,c.phone?`Teléfono: ${c.phone}`:"",c.area?`Sector: ${c.area}`:"",c.address?`Dirección: ${c.address}`:"",w.note?`Nota: ${w.note}`:""].filter(Boolean).join("\\n");return ["BEGIN:VEVENT",`UID:${w.id}@patitas-en-ruta`,`DTSTAMP:${stamp}`,`DTSTART:${icsLocal(w.date,w.time)}`,`DTEND:${icsLocal(w.date,w.time,minutes)}`,`SUMMARY:${icsEscape(`${service} · ${w.dog}`)}`,`DESCRIPTION:${icsEscape(details)}`,...((c.address||c.area)?[`LOCATION:${icsEscape(c.address||c.area)}`]:[]),"STATUS:CONFIRMED","END:VEVENT"].join("\r\n")}).join("\r\n");let content=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Patitas en Ruta//Agenda//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH",events,"END:VCALENDAR"].join("\r\n"),blob=new Blob([content],{type:"text/calendar;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Archivo de calendario listo. Ábrelo para agregar los servicios.")}
function render(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));document.getElementById("content").innerHTML=view==="home"?home():view==="agenda"?agenda():view==="clients"?clients():view==="security"?securityView():reports();if(view==="home"){setDogOptions();setServiceFields()}}
function setDogOptions(){let sel=document.getElementById("wDog"),csel=document.getElementById("wClient");if(!sel||!csel)return;let c=client(csel.value),prior=editWalk?db.walks.find(w=>w.id===editWalk)?.dog:"";sel.innerHTML=(c?.dogs||[]).map(d=>`<option ${d===prior?"selected":""}>${esc(d)}</option>`).join("")}
function setServiceFields(){let s=document.getElementById("wService")?.value,hotel=s==="Hotel",nights=document.getElementById("wNightsField"),mins=document.getElementById("wMinutesField"),label=document.getElementById("wPriceLabel");if(nights)nights.classList.toggle("hidden",!hotel);if(mins)mins.classList.toggle("hidden",hotel);if(label)label.textContent=hotel?"Precio por noche (CLP)":s==="Pet sitter"?"Precio por servicio (CLP)":s==="Trekking"?"Precio por trekking (CLP)":"Precio por paseo (CLP)"}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("[data-view]");if(b){view=b.dataset.view;render()}});
document.getElementById("content").addEventListener("change",e=>{if(e.target.id==="wClient")setDogOptions();if(e.target.id==="wService")setServiceFields();if(e.target.id==="filterDate"){filterDate=e.target.value;render()}if(e.target.id==="reportsMonth"){reportMonth=e.target.value||localDate().slice(0,7);render()}});
document.getElementById("content").addEventListener("click",e=>{let b=e.target.closest("[data-act]");if(!b)return;let id=b.dataset.id,w=db.walks.find(x=>x.id===id);switch(b.dataset.act){case"goAgenda":view="agenda";filterDate=localDate();render();break;case"today":filterDate=localDate();render();break;case"calendar":if(w)exportCalendar([w],`patitas-${w.service||"paseo"}-${w.date}-${w.dog.replace(/[^a-z0-9]/gi,"-")}.ics`);break;case"monthlyPaid":db.monthlyPaid[reportMonth+"|"+id]=!db.monthlyPaid[reportMonth+"|"+id];save();render();break;case"saveCommission":db.commissionByService={Paseo:Math.max(0,+document.getElementById("commission-Paseo").value||0),Trekking:Math.max(0,+document.getElementById("commission-Trekking").value||0),Hotel:Math.max(0,+document.getElementById("commission-Hotel").value||0),"Pet sitter":Math.max(0,+document.getElementById("commission-Petsitter").value||0)};db.commissionPerWalk=db.commissionByService.Paseo;db.commissionPaseoConfigured=true;db.commissionHotelConfigured=true;db.commissionPetSitterConfigured=true;save();toast("Comisiones actualizadas.");render();break;case"editClient":editClient=id;render();break;case"cancelClient":editClient=null;render();break;case"saveClient":{let c=client(editClient),owner=document.getElementById("cOwner").value.trim(),dogs=document.getElementById("cDogs").value.split(",").map(x=>x.trim()).filter(Boolean),monthlyFee=Math.max(0,+document.getElementById("cMonthly").value||0);if(!owner||!dogs.length){toast("Escribe el nombre del cliente y al menos un perro.");return}Object.assign(c,{owner,phone:document.getElementById("cPhone").value.trim(),area:document.getElementById("cArea").value.trim(),address:document.getElementById("cAddress").value.trim(),dogs,monthlyFee,note:document.getElementById("cNote").value.trim()});editClient=null;save();toast("Cliente actualizado");render();break}case"addClient":{let owner=document.getElementById("cOwner").value.trim(),dogs=document.getElementById("cDogs").value.split(",").map(x=>x.trim()).filter(Boolean),monthlyFee=Math.max(0,+document.getElementById("cMonthly").value||0);if(!owner||!dogs.length){toast("Escribe el nombre del cliente y al menos un perro.");return}db.clients.push({id:crypto.randomUUID(),owner,phone:document.getElementById("cPhone").value.trim(),area:document.getElementById("cArea").value.trim(),address:document.getElementById("cAddress").value.trim(),dogs,monthlyFee,note:document.getElementById("cNote").value.trim()});save();toast("Cliente guardado 🐾");render();break}case"deleteClient":if(confirm("¿Borrar este cliente? Los paseos anteriores se conservarán.")){db.clients=db.clients.filter(c=>c.id!==id);save();render()}break;case"saveWalk":{let c=client(document.getElementById("wClient").value);if(!c)return;let service=document.getElementById("wService").value,data={clientId:c.id,dog:document.getElementById("wDog").value,date:document.getElementById("wDate").value,time:document.getElementById("wTime").value,service,nights:service==="Hotel"?Math.max(1,+document.getElementById("wNights").value||1):1,minutes:service==="Hotel"?0:Math.max(1,+document.getElementById("wMinutes").value||60),price:Math.max(0,+document.getElementById("wPrice").value||0),status:document.getElementById("wStatus").value,paid:document.getElementById("wPaid").value==="yes",note:document.getElementById("wNote").value.trim()};if(!data.date||!data.dog){toast("Completa el perro y la fecha del servicio.");return}if(editWalk){Object.assign(db.walks.find(x=>x.id===editWalk),data);editWalk=null}else db.walks.push({id:crypto.randomUUID(),...data});save();filterDate=data.date;view="agenda";toast(`Servicio guardado para ${dateLabel(data.date)} · ${data.time} 🐾`);render();break}case"done":w.status="Realizado";save();render();break;case"paid":w.paid=!w.paid;save();render();break;case"edit":editWalk=id;view="home";render();document.getElementById("walkForm")?.scrollIntoView({behavior:"smooth",block:"start"});break;case"cancelEdit":editWalk=null;render();break;case"changePin":showPinSetup();break;case"removePin":if(confirm("¿Quitar la clave de este dispositivo? La app quedará sin bloqueo y se desactivará también la biometría.")){localStorage.removeItem(PIN_KEY);localStorage.removeItem(BIO_KEY);toast("Bloqueo desactivado.");render()}break;case"bioOn":if(!hasPin()){toast("Primero crea una clave de respaldo.");return}enableBio();break;case"bioOff":localStorage.removeItem(BIO_KEY);toast("Biometría desactivada.");render();break;case"delete":if(confirm("¿Borrar este paseo?")){db.walks=db.walks.filter(x=>x.id!==id);save();render()}break}});
document.getElementById("calendarExport").onclick=()=>exportCalendar(db.walks.filter(w=>w.date>=localDate()&&w.status==="Agendado"),"agenda-patitas-en-ruta.ics");document.getElementById("export").onclick=()=>{let a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.href=url;a.download="respaldo-patitas-en-ruta.json";a.click();URL.revokeObjectURL(url);toast("Respaldo descargado")};document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.clients)||!Array.isArray(obj.walks))throw 0;if(confirm("Importar este respaldo reemplazará los datos de este dispositivo. ¿Continuar?")){db=normalizedDb(obj);save();render();toast("Respaldo restaurado")}}catch{toast("El archivo no parece un respaldo válido")}};
accessControl();addEventListener("visibilitychange",()=>{if(document.hidden&&hasPin())lockScreen()});if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
