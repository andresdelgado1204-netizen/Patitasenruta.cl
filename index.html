function localDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function normalizedDb(obj){obj=obj&&typeof obj==="object"?obj:{};obj.clients=Array.isArray(obj.clients)?obj.clients:[];obj.walks=Array.isArray(obj.walks)?obj.walks:[];obj.walkers=Array.isArray(obj.walkers)?obj.walkers:[];obj.monthlyPaid=obj.monthlyPaid||{};obj.monthlyPays=Array.isArray(obj.monthlyPays)?obj.monthlyPays:[];let old=Number.isFinite(Number(obj.commissionPerWalk))?Math.max(0,+obj.commissionPerWalk):0;obj.commissionByService={Paseo:1000,Trekking:0,Hotel:2000,"Pet sitter":2000,...(obj.commissionByService||{})};if(!obj.commissionPaseoConfigured)obj.commissionByService.Paseo=1000;if(!obj.commissionHotelConfigured)obj.commissionByService.Hotel=2000;if(!obj.commissionPetSitterConfigured)obj.commissionByService["Pet sitter"]=2000;obj.walks.forEach(w=>{w.service=w.service||"Paseo";w.nights=Math.max(1,+w.nights||1)});let seen=new Set();obj.walks=obj.walks.filter(w=>{if(w.status==="Cancelado")return true;let k=[w.clientId,w.dog,w.date,w.time,w.service,w.status].join("|");if(seen.has(k))return false;seen.add(k);return true});return obj}
function busyTap(){let n=Date.now();if(n-(busyTap.t||0)<1200)return true;busyTap.t=n;return false}
function addWalks(list){let n=0,added=[];list.forEach(w=>{if(db.walks.some(x=>x.status!=="Cancelado"&&x.clientId===w.clientId&&x.dog===w.dog&&x.date===w.date&&x.time===w.time&&x.service===w.service))return;db.walks.push(w);added.push(w);n++});if(added.length)setTimeout(()=>offerGcal(added),150);return n}
try{db=normalizedDb(JSON.parse(localStorage.getItem(KEY)||"null")||db)}catch{}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Number(n)||0)}
function dateLabel(s){if(!s)return "";return new Date(s+"T12:00:00").toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"short"})}
function walkTimeRange(w){let duration=Math.max(1,Number(w.minutes)||60),match=/^(\d{2}):(\d{2})$/.exec(w.time||"");if(!match)return `Hora sin definir · ${duration} min`;let start=Number(match[1])*60+Number(match[2]),end=start+duration,day=Math.floor(end/1440),clock=n=>`${String(Math.floor((n%1440)/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;return `${clock(start)}–${clock(end)}${day?" (+1 día)":""} · ${duration} min`}
function monthKey(s){return (s||"").slice(0,7)}

const COUNTRIES=[["🇨🇱","+56"],["🇻🇪","+58"],["🇨🇴","+57"],["🇵🇪","+51"],["🇦🇷","+54"],["🇧🇴","+591"],["🇧🇷","+55"],["🇪🇨","+593"],["🇺🇾","+598"],["🇵🇾","+595"],["🇲🇽","+52"],["🇭🇹","+509"],["🇺🇸","+1"],["🇪🇸","+34"]];
function splitPhone(p){p=String(p||"").trim();if(!p)return{code:"+56",rest:""};let m=COUNTRIES.map(x=>x[1]).sort((a,b)=>b.length-a.length).find(code=>p.startsWith(code)&&(p.length===code.length||/[\s\d]/.test(p[code.length])));return m?{code:m,rest:p.slice(m.length).trim()}:{code:"+56",rest:p}}
function phoneField(c){let pc=splitPhone(c?.phone);return `<div class="field span2"><label>📞 Teléfono</label><div class="phone-row"><select id="cCode" aria-label="País">${COUNTRIES.map(([f,code])=>`<option value="${code}" ${code===pc.code?"selected":""}>${f} ${code}</option>`).join("")}</select><input id="cPhone" type="tel" inputmode="tel" placeholder="9 1234 5678" value="${esc(pc.rest)}"></div></div>`}
function phoneValue(){let n=(document.getElementById("cPhone")?.value||"").trim();if(!n)return"";if(n.startsWith("+"))return n;return (document.getElementById("cCode")?.value||"+56")+" "+n.replace(/^0+/,"")}
let calMonth=null;

function schedFields(c){return `<div class="field span4"><label style="font-size:.95rem;color:var(--purple)">📅 Agendar un servicio (opcional)</label><p class="hint" style="margin:0">Si anotas fecha y hora, el servicio se agenda al guardar.</p></div><div class="field"><label>🦮 Servicio</label><select id="sService">${["Paseo","Trekking","Hotel","Pet sitter"].map(x=>`<option value="${x}">${{"Paseo":"🐶","Trekking":"🥾","Hotel":"🏨","Pet sitter":"🏠"}[x]} ${x}</option>`).join("")}</select></div><div class="field"><label>🐶 Perro</label><select id="sDog">${dogOptions(c?.dogs||[],"")}</select></div><div class="field span4"><label>📅 Fecha y hora</label><button type="button" class="btn secondary small" data-act="toggleCal">➕ Agregar fecha</button><div id="sRows"></div><div id="sCal" class="mini-cal hidden"></div></div><div class="field" id="sMinutesField"><label>⏱️ Duración (min)</label><input id="sMinutes" type="number" min="1" inputmode="numeric" value="60"></div><div class="field hidden" id="sNightsField"><label>🌙 Noches</label><input id="sNights" type="number" min="1" inputmode="numeric" value="1"></div>`}

function cloudPanel(){if(!cloud||!cloud.on||!cloud.user)return "";let bak=false;try{bak=!!localStorage.getItem(BAK_KEY)}catch{}return `<section class="panel"><h2>☁️ Cuenta y sincronización</h2><p class="hint">Sesión: <b>${esc(cloud.user.email)}</b>${cloud.admin?" · 👑 Administrador":""}. Tus datos se guardan en la nube y se actualizan en todos tus equipos.</p><div class="form-actions"><button class="btn secondary" data-act="cloudSyncNow">🔄 Sincronizar ahora</button></div><h3 style="margin:14px 0 6px">🔑 Cambiar contraseña</h3><div class="cpass"><input id="cpOld" type="password" autocomplete="current-password" placeholder="🔒 Contraseña actual"><input id="cpNew" type="password" autocomplete="new-password" placeholder="🔒 Contraseña nueva (mínimo 6)"></div><button class="btn secondary" data-act="cloudPass">Guardar contraseña</button>${bak?'<p class="hint" style="margin-top:12px">Este equipo tenía datos guardados antes de entrar a la nube.</p><button class="btn secondary" data-act="cloudMergeBak">📥 Agregar esos datos a mi cuenta</button>':""}</section>`}
function cloudSyncNow(){if(!cloud.on||!cloud.user)return;flushAll().then(()=>cloud.selfRef.get({source:"server"})).then(snap=>{onSelfSnap(snap);toast("Sincronizado ✅")}).catch(()=>toast("Sin conexión: se sincronizará cuando vuelva internet."))}
async function cloudLogout(){if(!confirm("¿Cerrar sesión en este equipo? Tus datos quedan guardados en la nube."))return;try{await flushAll()}catch{}if(cloud.err&&!confirm("Hay cambios que aún no se subieron. Si cierras sesión se perderán. ¿Cerrar de todos modos?"))return;cloudStop();try{[KEY,TS_KEY,SYNC_KEY,UID_KEY].forEach(k=>localStorage.removeItem(k))}catch{}db=normalizedDb({});cloud.selfDb=db;cloud.selfJson="";cloud.view="self";let bar=document.getElementById("adminbar");if(bar)bar.remove();await cloud.auth.signOut()}
async function cloudPass(){let o=document.getElementById("cpOld").value,n=document.getElementById("cpNew").value;if(!o||n.length<6){toast("Escribe tu contraseña actual y una nueva de al menos 6 caracteres.");return}try{let u=cloud.auth.currentUser,cred=firebase.auth.EmailAuthProvider.credential(u.email,o);await u.reauthenticateWithCredential(cred);await u.updatePassword(n);document.getElementById("cpOld").value="";document.getElementById("cpNew").value="";try{let bl=JSON.parse(localStorage.getItem(BIOLOGIN_KEY)||"null");if(bl&&bl.m===u.email){bl.p=btoa(unescape(encodeURIComponent(n)));localStorage.setItem(BIOLOGIN_KEY,JSON.stringify(bl))}}catch{}toast("Contraseña cambiada ✅")}catch(e){toast(/invalid-credential|wrong-password/.test((e&&e.code)||"")?"La contraseña actual no es correcta.":"No se pudo cambiar la contraseña ("+((e&&e.code)||"error")+").")}}
function cloudMergeBak(){let raw=null;try{raw=localStorage.getItem(BAK_KEY)}catch{}if(!raw)return;let b=normalizedDb(JSON.parse(raw)),cs=new Set(db.clients.map(c=>c.id)),ws=new Set(db.walks.map(w=>w.id)),nc=0,nw=0;b.clients.forEach(c=>{if(!cs.has(c.id)){db.clients.push(c);nc++}});b.walks.forEach(w=>{if(!ws.has(w.id)){db.walks.push(w);nw++}});try{localStorage.removeItem(BAK_KEY)}catch{}save();toast(`Se agregaron ${nc} clientes y ${nw} servicios.`);render()}
accessControl();addEventListener("visibilitychange",()=>{if(document.hidden&&hasPin())lockScreen()});if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
