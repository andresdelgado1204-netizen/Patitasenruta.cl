.theme-swatches{display:flex;gap:8px;margin-top:12px}
.swatch{width:26px;height:26px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.swatch.original{background:#3c164a}.swatch.lavender{background:#806094}.swatch.ocean{background:#357d91}.swatch.forest{background:#577e5c}.swatch.peach{background:#bd7463}


/* Tipografía uniforme, paleta clásica y navegación inferior */
body,button,input,select,textarea{font-family:Arial,Helvetica,sans-serif!important;font-feature-settings:"kern";letter-spacing:0}
body{font-weight:400}
button,.btn,.nav button{font-weight:600}
.panel h2,.stat strong,.walk-title,.client strong{font-weight:700}

@media(min-width:681px){
 .nav{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;z-index:30!important;display:flex!important;justify-content:center!important;gap:8px!important;margin:0!important;padding:8px 16px calc(8px + env(safe-area-inset-bottom))!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;background:var(--card)!important;box-shadow:0 -3px 16px #49331512!important;backdrop-filter:none!important}
 .nav button{flex:0 1 150px!important;min-height:46px!important;padding:8px 16px!important;flex-direction:row!important;gap:7px!important;border-radius:999px!important;font-size:.9rem!important}
 .nav-icon{font-size:1.05rem!important}
 .wrap{padding-bottom:calc(112px + env(safe-area-inset-bottom))!important}
}
@media(max-width:680px){
 .nav{background:var(--card)!important;border-top-color:var(--line)!important}
 .nav button{font-family:Arial,Helvetica,sans-serif!important}
}

.admin-bar select{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:9px;padding:8px 10px}
.hint,.panel p,.walk-meta,.client small{font-weight:400!important}
.field label,.admin-bar label{font-weight:600}
.sub-badge{background:#e6f0ff!important;color:#2b5aa8!important}
.cover-card{border-left:4px solid #2b5aa8!important}
.sub-group h3{margin:12px 0 6px;font-size:.95rem;color:var(--purple)}
.sub-note{margin:4px 0 10px}
.who-ico{font-size:.95em}
.xplus{display:inline!important;font-size:inherit!important;color:#8a4b00;background:#fde7c8;border-radius:999px;padding:1px 8px}
.enc-set{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.enc-set label{font-weight:700;font-size:.85rem;color:var(--purple)}.enc-set select{min-height:36px;border:1px solid var(--soft-line,var(--line));border-radius:10px;padding:6px 8px;background:var(--card);color:var(--ink)}
.sec-av{position:relative;cursor:pointer;overflow:visible!important;width:56px!important;height:56px!important;font-size:1.5rem!important}.sec-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.av-cam{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--soft-line,var(--line));display:grid;place-items:center;font-size:.7rem}.who-av{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:2px solid var(--name-color,#7c31ce)}
.walk-phone{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 10px}.walk-phone a{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;border-radius:10px;background:var(--purple-soft);color:var(--purple);font-weight:700;font-size:.85rem;text-decoration:none}.wa-btn{background:#25D366!important;color:#fff!important;display:inline-flex!important;align-items:center;gap:5px;padding:5px 10px!important;border-radius:10px;font-weight:700}.wa-ico{width:16px;height:16px;flex:0 0 auto}.contact-box{display:grid;gap:4px;background:var(--purple-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}.contact-box a{color:var(--purple);font-weight:600;text-decoration:none}
.sDateWrap{display:flex;align-items:center;gap:6px;cursor:pointer}.sDateWrap .sDate{border:1px solid var(--soft-line,var(--line))!important;border-radius:10px!important;background:var(--card)!important;color:var(--purple);font-weight:700;padding:6px 8px!important;min-height:38px;flex:0 1 auto;width:auto;max-width:190px}.sEdit{font-size:.85rem;opacity:.7}
.xline{color:#8a4b00!important;font-weight:600!important}
.pend-panel{border-color:#f0c27a!important;background:color-mix(in srgb,#fde7c8 45%,var(--card))!important}.pend-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--soft-line,var(--line))}.pend-row:first-of-type{border-top:0}.pend-row .fi small{display:block;color:var(--muted)}.pend-act{display:flex;gap:6px;align-items:center}.pend-act input{width:110px;min-height:36px;border:1px solid var(--soft-line,var(--line));border-radius:10px;padding:6px 8px;background:var(--card);color:var(--ink)}.nav-icon{position:relative}.nav-icon.has-dot::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#d9534f;color:#fff;font-size:.62rem;font-weight:700;line-height:16px;text-align:center}
.extra-btn{width:100%;margin:0 0 12px;justify-content:center;border-style:dashed!important}
.extra-badge{background:#fde7c8!important;color:#8a4b00!important}
.dog-filters{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 12px}.dog-filters input,.dog-filters select{width:100%;min-height:42px;border:1px solid var(--soft-line,var(--line))!important;border-radius:12px!important;background:var(--card)!important;padding:8px 12px!important;font-size:.9rem!important;font-weight:600;color:var(--ink);box-shadow:none!important;-webkit-appearance:none;appearance:none}.dog-filters select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%)!important;background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px!important;background-size:5px 5px!important;background-repeat:no-repeat!important;padding-right:32px!important;letter-spacing:.02em}.dog-filters input{font-weight:400}.dogList{padding:10px}.dogbox{margin-bottom:8px!important}.dog-person{grid-column:1/-1;font-weight:700;font-size:.8rem;color:var(--purple);margin:6px 2px 0;letter-spacing:.02em}.dog-person:first-child{margin-top:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.sec-user{display:flex;align-items:center;gap:12px;min-width:0}.sec-user .fi small{display:block;color:var(--muted);overflow-wrap:anywhere}.sec-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--name-color,#7c31ce);color:#fff;font:600 1.3rem "Fredoka",Nunito,sans-serif;flex:0 0 auto}.sec-actions{display:flex;gap:8px;flex-wrap:wrap}.sec-list .wfold:last-child{margin-bottom:0}.sec-body{padding:4px 14px 14px}.sec-body .look-lbl:first-child{margin-top:4px}
/* Ajustes para teléfono, tablet y computador */
.clist{padding:10px;display:grid;gap:8px}.clist .wfold{margin:0}
.clients-box>summary .fi strong{font-size:1.05rem}
.cfold-body .client>div:first-child{width:100%}
@media(max-width:680px){.panel-head .badge{align-self:flex-start}}
@media(min-width:760px){
 .clist{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
 .stats{grid-template-columns:repeat(4,minmax(0,1fr))!important}
 .sheet{align-items:center}.sheet-card{border-radius:20px!important;max-height:86vh}
 .wfold>summary{padding:12px 14px}
 .trow{padding:11px 12px}
 #content>.panel{margin-bottom:14px}
 .team-walks .trow{display:inline-flex;width:calc(50% - 4px);vertical-align:top}
}
@media(min-width:1100px){
 .clist{grid-template-columns:repeat(3,minmax(0,1fr))}
 .wrap,header{max-width:1180px}
 .form-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(hover:hover){.wfold>summary:hover,.trow:hover{background:var(--purple-soft)}}

.cfold-body{padding:0 12px}.cfold-body .client{border-top:0!important;flex-direction:column}.cfold-body .walk-actions{justify-content:flex-start}
.send-choice{background:var(--purple-soft);border-radius:12px;padding:12px;margin-top:6px}.send-choice label{color:var(--purple)!important;font-size:.95rem!important}
.wfold{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 7px;overflow:hidden}
.wfold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px}
.wfold>summary::-webkit-details-marker{display:none}
.wfold .ft{font-weight:800;color:var(--purple);min-width:92px;font-variant-numeric:tabular-nums}
.wfold .fi{flex:1;min-width:0}.wfold .fi strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wfold .fi small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfold .fc{color:var(--muted);transition:transform .15s}.wfold[open]>summary .fc{transform:rotate(180deg)}
.wfold[open]>summary{border-bottom:1px solid var(--line)}.wfold .wc{border:0!important;margin:0!important;border-radius:0}
.wfold.off{opacity:.6}.more-box>summary{list-style:none;cursor:pointer;color:var(--purple);font-weight:700;padding:8px 2px}.more-box>summary::-webkit-details-marker{display:none}
.trow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;cursor:pointer}
.trow .tt{font-weight:800;color:var(--purple);min-width:96px;font-size:.9rem}.trow .ti{flex:1;min-width:0}.trow .ti small{display:block;color:var(--muted)}
.who-name{font-family:"Fredoka",Nunito,system-ui,sans-serif!important;font-weight:600;letter-spacing:.01em;font-size:1.5rem;color:var(--name-color,#7c31ce);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw;align-self:center}.name-preview{font-family:"Fredoka",Nunito,system-ui,sans-serif!important;font-weight:600;font-size:1.35rem;color:var(--name-color,#7c31ce)}

.lock{background-image:inherit}

.sheet-card .panel-head{flex-direction:row!important;align-items:center;justify-content:space-between}.sheet-card .panel-head .btn{width:auto!important;flex:0 0 auto}.sub-badge{white-space:nowrap}

/* ===== Estilo minimalista (solo apariencia) ===== */
:root{--soft-line:color-mix(in srgb,var(--line) 70%,transparent)}
body{letter-spacing:.005em}
.panel,.stat{box-shadow:none!important;border:1px solid var(--soft-line)!important;border-radius:16px!important}
.panel{padding:16px 16px!important;margin-bottom:12px!important}
.panel h2{font-size:1rem!important;font-weight:700!important;letter-spacing:0}
.panel-head{margin-bottom:10px}
.hint,.panel p.hint,small.hint{font-size:.84rem!important;line-height:1.45}
.btn{box-shadow:none!important;border-radius:10px!important;font-weight:600!important;letter-spacing:0}
.btn:hover{transform:none!important;box-shadow:none!important;filter:brightness(1.05)}
.btn.secondary{background:transparent!important;border:1px solid var(--soft-line)!important}
.btn.small{padding:7px 12px!important;min-height:36px!important;font-size:.85rem!important}
.btn.danger,.btn.secondary.danger{color:var(--red)!important}
.field label{font-size:.78rem!important;font-weight:600!important;color:var(--muted)!important;letter-spacing:.01em}
.field input,.field select,.field textarea,.filters input,.filters select,.admin-bar select,.cpass input{border:1px solid var(--soft-line)!important;border-radius:10px!important;box-shadow:none!important}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--purple) 14%,transparent)!important}
.total-box{background:var(--purple-soft)!important;border-color:transparent!important;font-weight:700!important}
.badge{font-size:.72rem!important;padding:3px 8px!important;font-weight:600!important}
.stats{gap:8px!important}
.stat{padding:12px!important;background:var(--card)!important}
.stat span{font-size:.78rem!important}
.stat strong{font-size:1.15rem!important;margin-top:2px!important}
.admin-bar{border:1px solid var(--soft-line)!important;box-shadow:none!important;padding:8px 12px!important;border-radius:14px!important}
.admin-bar .hint{display:none}
.wfold,.trow,.mrow,.xrow{border-color:var(--soft-line)!important;border-radius:12px!important;box-shadow:none!important}
.wfold>summary{padding:10px 12px!important}
.wfold[open]>summary{border-bottom-color:var(--soft-line)!important}
.wc{border:0!important;box-shadow:none!important}
.walk-address a{border-radius:10px!important;padding:9px 11px!important;min-height:0!important;font-size:.88rem!important}

async function cloudPass(){let o=document.getElementById("cpOld").value,n=document.getElementById("cpNew").value;if(!o||n.length<6){toast("Escribe tu contraseña actual y una nueva de al menos 6 caracteres.");return}try{let u=cloud.auth.currentUser,cred=firebase.auth.EmailAuthProvider.credential(u.email,o);await u.reauthenticateWithCredential(cred);await u.updatePassword(n);document.getElementById("cpOld").value="";document.getElementById("cpNew").value="";try{let bl=JSON.parse(localStorage.getItem(BIOLOGIN_KEY)||"null");if(bl&&bl.m===u.email){bl.p=btoa(unescape(encodeURIComponent(n)));localStorage.setItem(BIOLOGIN_KEY,JSON.stringify(bl))}}catch{}toast("Contraseña cambiada ✅")}catch(e){toast(/invalid-credential|wrong-password/.test((e&&e.code)||"")?"La contraseña actual no es correcta.":"No se pudo cambiar la contraseña ("+((e&&e.code)||"error")+").")}}
function cloudMergeBak(){let raw=null;try{raw=localStorage.getItem(BAK_KEY)}catch{}if(!raw)return;let b=normalizedDb(JSON.parse(raw)),cs=new Set(db.clients.map(c=>c.id)),ws=new Set(db.walks.map(w=>w.id)),nc=0,nw=0;b.clients.forEach(c=>{if(!cs.has(c.id)){db.clients.push(c);nc++}});b.walks.forEach(w=>{if(!ws.has(w.id)){db.walks.push(w);nw++}});try{localStorage.removeItem(BAK_KEY)}catch{}save();toast(`Se agregaron ${nc} clientes y ${nw} servicios.`);render()}
accessControl();addEventListener("visibilitychange",()=>{if(document.hidden&&hasPin())lockScreen()});if("serviceWorker"in navigator)addEventListener("load",()=>{let had=!!navigator.serviceWorker.controller,done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||done)return;done=true;let a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){toast("Hay una versión nueva. Se aplicará al recargar.");return}location.reload()});navigator.serviceWorker.register("sw.js").then(r=>{try{r.update()}catch{}}).catch(()=>{})});
